<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Maya! 🎂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        }

        /* Birthday Theme */
        body.birthday-day {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 50px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .date-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 4rem;
            margin: 20px 0;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .nickname {
            font-size: 1.5rem;
            color: #666;
            font-style: italic;
            margin: 10px 0 30px 0;
        }

        .emoji {
            font-size: 6rem;
            margin: 20px 0;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-30px) rotate(-5deg);
            }
            50% {
                transform: translateY(-40px) rotate(0deg);
            }
            75% {
                transform: translateY(-30px) rotate(5deg);
            }
        }

        .message {
            font-size: 1.4rem;
            line-height: 2;
            color: #333;
            margin: 30px 0;
        }

        .balloons {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            font-size: 3rem;
            animation: float 8s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-150px) rotate(360deg);
                opacity: 0;
            }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f0f;
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .button {
            display: inline-block;
            padding: 18px 45px;
            margin: 20px 10px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(245, 87, 108, 0.4);
        }

        .countdown {
            font-size: 1.3rem;
            color: #666;
            margin-top: 25px;
            font-style: italic;
            font-weight: bold;
        }

        .wishes-container {
            margin-top: 40px;
            padding: 30px;
            background: linear-gradient(135deg, #fff5f5 0%, #ffe5f0 100%);
            border-radius: 20px;
            border: 3px solid #f093fb;
        }

        .wish {
            font-size: 1.2rem;
            color: #555;
            margin: 15px 0;
            padding: 15px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .cake-animation {
            font-size: 5rem;
            margin: 20px 0;
            animation: cake-glow 2s ease-in-out infinite;
        }

        @keyframes cake-glow {
            0%, 100% {
                filter: drop-shadow(0 0 5px #f093fb);
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 20px #f5576c);
                transform: scale(1.1);
            }
        }
    </style>
</head>
<body>
    <div class="balloons" id="balloons"></div>
    
    <div class="container">
        <div class="date-badge" id="dateBadge"></div>
        <div class="emoji" id="emoji"></div>
        <h1 id="title"></h1>
        <div class="nickname" id="nickname"></div>
        <p class="message" id="message"></p>
        
        <div id="specialContent"></div>
        
        <button class="button" onclick="celebrate()">🎉 Celebrate! 🎉</button>
        <div class="countdown" id="countdown"></div>
    </div>

    <script>
        function getDateInfo() {
            const now = new Date();
            const month = now.getMonth(); // 0-11 (May = 4)
            const day = now.getDate();
            
            // May 5th - Birthday!
            if (month === 4 && day === 5) {
                return {
                    type: 'birthday-day',
                    badge: 'May 5th - Special Day!',
                    emoji: '🎂',
                    title: 'Happy Birthday Maya! 🎉',
                    nickname: '(aka Ghuntudo 💕)',
                    message: 'Today is YOUR day! A day to celebrate the amazing person you are, the joy you bring to everyone around you, and all the wonderful moments yet to come. You make the world brighter just by being in it!',
                    balloons: '🎈',
                    showWishes: true
                };
            }
            // Before birthday
            else if (month < 4 || (month === 4 && day < 5)) {
                const birthday = new Date(now.getFullYear(), 4, 5);
                return {
                    type: 'valentine-day',
                    badge: 'Coming Soon',
                    emoji: '🎁',
                    title: 'Maya\'s Birthday is Coming!',
                    nickname: '(our Ghuntudo 💝)',
                    message: 'Get ready for a special celebration! Something amazing is just around the corner...',
                    balloons: '🎈',
                    upcoming: true
                };
            }
            // After birthday
            else {
                return {
                    type: 'valentine-day',
                    badge: 'Until Next Year',
                    emoji: '✨',
                    title: 'Hope You Had an Amazing Birthday, Maya!',
                    nickname: '(sweet Ghuntudo 💕)',
                    message: 'Every day with you is special, but May 5th will always be extra magical. Here\'s to all the joy and love you deserve, today and every day!',
                    balloons: '💝'
                };
            }
        }

        function initializePage() {
            const dateInfo = getDateInfo();
            
            // Set body class for theme
            document.body.className = dateInfo.type;
            
            // Update content
            document.getElementById('dateBadge').textContent = dateInfo.badge;
            document.getElementById('emoji').textContent = dateInfo.emoji;
            document.getElementById('title').textContent = dateInfo.title;
            document.getElementById('nickname').textContent = dateInfo.nickname;
            document.getElementById('message').textContent = dateInfo.message;
            
            // Show special birthday wishes if it's the day
            if (dateInfo.showWishes) {
                showBirthdayWishes();
            }
            
            // Create floating balloons
            createFloatingBalloons(dateInfo.balloons);
            
            // Update countdown if needed
            if (dateInfo.upcoming) {
                updateCountdown();
                setInterval(updateCountdown, 1000);
            }
        }

        function showBirthdayWishes() {
            const wishes = [
                "🌟 May this year bring you endless happiness and unforgettable memories!",
                "💖 You deserve all the love, joy, and cake in the world today!",
                "🎊 Here's to another year of being absolutely wonderful!",
                "🌸 May your dreams come true and your smile never fade!"
            ];
            
            const container = document.createElement('div');
            container.className = 'wishes-container';
            
            wishes.forEach((wish, index) => {
                setTimeout(() => {
                    const wishDiv = document.createElement('div');
                    wishDiv.className = 'wish';
                    wishDiv.textContent = wish;
                    wishDiv.style.animation = 'fadeIn 0.8s ease-in';
                    container.appendChild(wishDiv);
                }, index * 500);
            });
            
            document.getElementById('specialContent').appendChild(container);
        }

        function createFloatingBalloons(symbol) {
            const balloonsContainer = document.getElementById('balloons');
            
            // Create confetti effect
            setInterval(() => {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.background = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f093fb', '#feca57'][Math.floor(Math.random() * 5)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                balloonsContainer.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 3000);
            }, 200);
            
            // Create floating balloons
            setInterval(() => {
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.textContent = symbol;
                balloon.style.left = Math.random() * 100 + '%';
                balloon.style.animationDuration = (Math.random() * 4 + 6) + 's';
                balloon.style.animationDelay = Math.random() * 2 + 's';
                
                balloonsContainer.appendChild(balloon);
                
                setTimeout(() => balloon.remove(), 10000);
            }, 400);
        }

        function celebrate() {
            const dateInfo = getDateInfo();
            
            // Show celebration message
            const messages = [
                '🎉 Hip Hip Hooray for Maya! 🎉',
                '🎂 Make a wish, Ghuntudo! 🎂',
                '🎈 You are loved and celebrated! 🎈',
                '💖 Best birthday ever for the best person ever! 💖'
            ];
            
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            alert(randomMessage);
            
            // Create massive balloon/confetti burst
            const balloonsContainer = document.getElementById('balloons');
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    // Balloons
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon';
                    balloon.textContent = dateInfo.balloons;
                    balloon.style.left = (Math.random() * 100) + '%';
                    balloon.style.top = '50%';
                    balloon.style.fontSize = (Math.random() * 3 + 2) + 'rem';
                    balloonsContainer.appendChild(balloon);
                    
                    // Confetti
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = (Math.random() * 100) + '%';
                    confetti.style.top = '20%';
                    confetti.style.background = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f093fb', '#feca57'][Math.floor(Math.random() * 5)];
                    balloonsContainer.appendChild(confetti);
                }, i * 30);
            }
        }

        function updateCountdown() {
            const now = new Date();
            const birthday = new Date(now.getFullYear(), 4, 5, 0, 0, 0);
            
            if (now >= birthday) {
                document.getElementById('countdown').textContent = '';
                return;
            }
            
            const diff = birthday - now;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('countdown').textContent = 
                `🎂 Maya's Birthday in: ${days}d ${hours}h ${minutes}m ${seconds}s 🎂`;
        }

        // Initialize on load
        initializePage();
        
        // Auto-refresh at midnight to show birthday content
        setInterval(() => {
            const now = new Date();
            if (now.getHours() === 0 && now.getMinutes() === 0 && now.getSeconds() === 0) {
                location.reload();
            }
        }, 1000);
    </script>
</body>
</html>
